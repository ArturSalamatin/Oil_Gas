[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpn-multiphase-solver"
version = "0.1.0"
description = "FVM solver for two-phase Black Oil filtration with energy equation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # Шаблон книги ввода Excel (gpn-solver template, FEAT-033). Граница — как
    # у прототипа (его pyproject.toml): в общем окружении одна версия.
    "XlsxWriter>=3.2",
    # Прототип гидродинамики (HydroSolverPrototype/Prototype_1.0.3) — отдельный
    # дистрибутив в этом же репозитории (DEBT-059). Ровно эта версия: с нашими
    # правками прототипа совместима только она (тест test_packaging.py). Метка
    # «+gpn.1» — локальная; PyPI таких версий не принимает, поэтому чужой
    # пакет с тем же именем зависимость не удовлетворит. Ставить вместе:
    #   pip install -e HydroSolverPrototype/Prototype_1.0.3 -e ".[dev]"
    "radial-blackoil==1.0.3+gpn.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
# Команда расчёта по конфигу (FEAT-030) — то же, что
# python -m gpn_multiphase_solver run config.json. На Windows gpn-solver.exe
# ложится в Scripts\ окружения: без активации venv её нет в PATH, тогда —
# форма python -m.
gpn-solver = "gpn_multiphase_solver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpn_multiphase_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Прототип — из этого же дерева, а не установленный: venv общий для основного
# каталога и worktree, установленный radial_blackoil указывает на основной
# каталог, а тесты worktree обязаны проверять свой код (DEBT-059). Путь — от
# каталога этого файла. Установку проверяет приёмка в чистом окружении
# (vault/issues/debt-059/probes/clean_env_acceptance.py).
pythonpath = ["HydroSolverPrototype/Prototype_1.0.3"]
# slow — тяжёлые тесты: расчёт примеров на штатных конфигах или на
# сгущённой сетке. Считаются по умолчанию (полный прогон, ~10 мин);
# быстрый уровень после шага реализации: pytest -m "not slow" (~70 с).
# Тесты на фикстуре results получают метку автоматически —
# хук в tests/conftest.py (DEBT-032).
markers = [
    "slow: тяжёлый тест — расчёт примеров на штатных конфигах или на сгущённой сетке",
]
