[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpn-multiphase-solver"
version = "0.1.0"
description = "FVM solver for two-phase Black Oil filtration with energy equation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # Вывод results.xlsx в HydroSolverPrototype (run_prototype.py и его тесты);
    # пакет gpn_multiphase_solver его не импортирует.
    "XlsxWriter>=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpn_multiphase_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# slow — тяжёлые тесты: расчёт примеров на штатных конфигах или на
# сгущённой сетке. Считаются по умолчанию (полный прогон, ~10 мин);
# быстрый уровень после шага реализации: pytest -m "not slow" (~70 с).
# Тесты на фикстуре results получают метку автоматически —
# хук в tests/conftest.py (DEBT-032).
markers = [
    "slow: тяжёлый тест — расчёт примеров на штатных конфигах или на сгущённой сетке",
]
